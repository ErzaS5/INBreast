data_root: data/INbreast Release 1.0
metadata_pairs: artifacts/metadata_pairs.csv
mode: crossval
output_dir: artifacts/phase1_resnet18
seed: 42
grouped_split: true
folds: 5
inner_val_fraction: 0.15
threshold_fraction: 0.15
calibration_fraction: 0.10
test_fraction: 0.20
backbone: resnet18
size: 384
dropout: 0.3
batch_size: 2
epochs: 25
workers: 0
lr: 0.00002
weight_decay: 0.0001
augmentations: true
freeze_epochs: 2
checkpoint_metric: pr_auc
patience: 5
scheduler: plateau
checkpoint_every: 0
threshold:
  strategy: min_sensitivity
  fixed_value: 0.5
  minimum_sensitivity: 0.90
calibration:
  method: none
  bins: 10
gradcam:
  enabled: false
  examples: 0
  categories: [FN, FP, TP, TN]
  threshold: 0.5
bootstrap_iterations: 2000
eval_split: test
device: auto
cache_dir: artifacts/preprocessed
